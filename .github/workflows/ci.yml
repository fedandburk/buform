name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: xcode-27
    timeout-minutes: 30
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore

      - name: Check format
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        run: dotnet build Buform.sln

      - name: Test
        run: |
          dotnet test --project Buform.Tests --no-build
          dotnet test --project Buform.FluentValidation.Tests --no-build

  publish:
    name: Publish
    runs-on: xcode-27
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore

      - name: Build
        run: dotnet pack --configuration Release --output publish

      - name: Upload packages to NuGet
        run: dotnet nuget push "publish/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Upload packages to GitHub Packages
        run: dotnet nuget push "publish/*.nupkg" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          generate_release_notes: true
          files: publish/*.nupkg
