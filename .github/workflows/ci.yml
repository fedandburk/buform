name: ci

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

  workflow_dispatch:

jobs:

  ci:

    runs-on: macos-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

     name: Setup Xcode 26.2 (required for .NET iOS build)
          run: |
            if [ -d "/Applications/Xcode_26.2.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.2.app
            else
              echo "Xcode 26.2 not found on this runner image" >&2
              ls -1 /Applications | grep Xcode || true
              exit 1
            fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Restore workloads
      run: dotnet workload restore

    - name: Check code style with CSharpier
      run: |
          dotnet tool restore
          dotnet csharpier --check .
        
    - name: Verify environment
      run: |
          xcodebuild -version
          dotnet --info

    - name: Build
      run: dotnet build
